name: fr_acdd
description: "Contract annotations and shared BFF DTO export for FlowR contract-first pages."
version: 0.6.0
repository: "https://github.com/Hu-Wentao/flowr"

environment:
  sdk: ^3.7.0

resolution: workspace

dependencies:
  # extract_bff is verified with the analyzer generations used by this
  # workspace (6.x and 10.0.1). Analyzer 13 changed AST APIs used by the
  # extractor, so exclude 11+ until the extractor is migrated.
  analyzer: ">=6.0.0 <11.0.0"
  args: ^2.6.0
  freezed_annotation: ">=2.4.4 <4.0.0"
  meta: ^1.16.0
  path: ^1.9.1

dev_dependencies:
  lints: ">=3.0.0"
  test: ^1.25.0
