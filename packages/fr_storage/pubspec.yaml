name: fr_storage
description: Encrypted box-based key-value storage for Flutter, backed by ObjectBox and platform secure storage.
version: 0.1.0
repository: https://github.com/Hu-Wentao/flowr
topics:
  - storage
  - encryption
  - objectbox

environment:
  sdk: ^3.7.0
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.0
  flat_buffers: ^25.9.23
  flutter_secure_storage: ^9.2.0
  hive_ce: ^2.19.3
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  pointycastle: ^4.0.0

dev_dependencies:
  build_runner: ^2.4.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  objectbox_generator: ^5.3.2
