name: flowr
description: "FlowR: state management package for the MVVM pattern based on reactive programming."
version: 2.1.2
repository: "https://github.com/Hu-Wentao/flowr"

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.7.0
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flowr_dart: ^2.3.0
  rxdart: ^0.27.7
  slowly: ^0.3.0
  get_it: ^8.2.0
  injectable: ^2.3.5 # fixed; adapt flutter 3.16.7;
  provider: ^6.1.5
  stack_trace: ^1.11.1
  async: ^2.11.0 # fixed; adapt flutter 3.16.7;

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

