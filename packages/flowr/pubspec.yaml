name: flowr
description: "FlowR: state management package for the MVVM pattern based on reactive programming."
version: 1.2.0
repository: "https://github.com/Hu-Wentao/flowr"

environment:
  sdk: '>=3.2.4 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flowr_dart: ^1.1.0
  rxdart: ^0.27.7
  slowly: ^0.3.0
  get_it: ^8.2.0 #^7.6.7 # fixed; "8.0.0-pre-1" is "7.6.7+1", use 'getAll';
  injectable: ^2.3.5 # fixed; adapt flutter 3.16.7;
  provider: ^6.1.5
  stack_trace: ^1.11.1
  async: ^2.11.0 # fixed; adapt flutter 3.16.7;

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0 # fixed; adapt flutter 3.16.7

