name: flowr
description: "FlowR: state management package for the MVVM pattern based on reactive programming."
version: 6.0.0
repository: "https://github.com/Hu-Wentao/flowr"
topics:
  - flowr
  - state-management
  - bloc
  - mvvm

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.7.0
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.0.0
  flowr_dart: ^4.0.0
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  injectable: ^2.3.5 # fixed; adapt flutter 3.16.7;
  provider: ^6.1.5
  stack_trace: ^1.11.1
  async: ^2.11.0 # fixed; adapt flutter 3.16.7;

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

